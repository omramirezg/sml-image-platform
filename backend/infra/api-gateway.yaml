AWSTemplateFormatVersion: '2010-09-09'
Description: SmartMedia Labs - API Gateway REST con integraciones Lambda (AWS_PROXY)

Resources:

  # ── 1. REST API ──────────────────────────────────────────────
  SmlApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: sml-api
      Description: API REST de SmartMedia Labs para upload y consulta de imágenes
      EndpointConfiguration:
        Types:
          - REGIONAL

  # ── 2. Recursos (rutas) ──────────────────────────────────────

  UploadResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SmlApi
      ParentId: !GetAtt SmlApi.RootResourceId
      PathPart: upload

  HistoryResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SmlApi
      ParentId: !GetAtt SmlApi.RootResourceId
      PathPart: history

  StatusResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SmlApi
      ParentId: !GetAtt SmlApi.RootResourceId
      PathPart: status

  StatusIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SmlApi
      ParentId: !Ref StatusResource
      PathPart: '{id}'

  # ── 3. POST /upload → sml-generate-presigned-url ────────────

  UploadPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SmlApi
      ResourceId: !Ref UploadResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/\
          arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sml-generate-presigned-url/invocations"

  UploadOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SmlApi
      ResourceId: !Ref UploadResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # ── 4. GET /history (pendiente de implementación) ───────────

  HistoryGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SmlApi
      ResourceId: !Ref HistoryResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: '{"images": [], "message": "History endpoint not yet implemented"}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  HistoryOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SmlApi
      ResourceId: !Ref HistoryResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # ── 5. GET /status/{id} (pendiente de implementación) ───────

  StatusIdGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SmlApi
      ResourceId: !Ref StatusIdResource
      HttpMethod: GET
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: '{"status": "NOT_IMPLEMENTED", "message": "Status endpoint not yet implemented"}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  StatusIdOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SmlApi
      ResourceId: !Ref StatusIdResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # ── 6. Deployment + Stage ────────────────────────────────────
  # Nota: CloudFormation no redesploya el stage automáticamente al cambiar
  # integraciones. El pipeline fuerza un nuevo deployment vía CLI después
  # de este stack (paso "Forzar redespliegue del stage prod" en deploy-infra).

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - UploadPostMethod
      - UploadOptionsMethod
      - HistoryGetMethod
      - HistoryOptionsMethod
      - StatusIdGetMethod
      - StatusIdOptionsMethod
    Properties:
      RestApiId: !Ref SmlApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref SmlApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod
      Description: Production stage

# ── Outputs ──────────────────────────────────────────────────
Outputs:

  ApiId:
    Description: ID de la API Gateway
    Value: !Ref SmlApi
    Export:
      Name: SmlApiId

  ApiUrl:
    Description: URL base de la API
    Value: !Sub 'https://${SmlApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: SmlApiUrl

  UploadEndpoint:
    Description: Endpoint para solicitar presigned URL de upload
    Value: !Sub 'https://${SmlApi}.execute-api.${AWS::Region}.amazonaws.com/prod/upload'

  HistoryEndpoint:
    Description: Endpoint para listar historial de imágenes
    Value: !Sub 'https://${SmlApi}.execute-api.${AWS::Region}.amazonaws.com/prod/history'

  StatusEndpoint:
    Description: Endpoint para consultar estado de una imagen
    Value: !Sub 'https://${SmlApi}.execute-api.${AWS::Region}.amazonaws.com/prod/status/{id}'
