AWSTemplateFormatVersion: '2010-09-09'
Description: SmartMedia Labs - API Gateway con integracion a Lambda generate-presigned-url

# ============================================================
# Arquitectura v2 (simplificada post-feedback de la profesora):
#   Cliente -> CloudFront -> API Gateway -> Lambda 1 (presigned URL)
#   Cliente -> S3 input directamente con la URL
#   S3 trigger -> Lambda 2 (process-image)
#   Lambda 2 -> S3 output + DynamoDB + SNS -> email al admin
#
# Esta plantilla cubre SOLO el API Gateway con su endpoint POST /upload
# conectado a la Lambda generate-presigned-url. El resto de la
# infraestructura (S3, DynamoDB, SNS, Lambdas) se gestiona por separado.
# ============================================================

Parameters:

  GeneratePresignedUrlLambdaArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:372123585270:function:sml-generate-presigned-url
    Description: ARN de la Lambda que genera presigned URLs (la despliega Juan Pablo)

  AllowedCorsOrigin:
    Type: String
    Default: '*'
    Description: Origin permitido en CORS. En produccion debe ser el dominio del frontend.

Resources:

  # ============================================================
  # 1. REST API
  # ============================================================
  SmlApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: sml-api
      Description: API REST de SmartMedia Labs - genera presigned URLs para upload directo a S3
      EndpointConfiguration:
        Types:
          - REGIONAL

  # ============================================================
  # 2. Resource /upload
  # ============================================================
  UploadResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SmlApi
      ParentId: !GetAtt SmlApi.RootResourceId
      PathPart: upload

  # ============================================================
  # 3. POST /upload (integrado con Lambda generate-presigned-url)
  # ============================================================
  UploadPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SmlApi
      ResourceId: !Ref UploadResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GeneratePresignedUrlLambdaArn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # OPTIONS /upload (CORS preflight)
  UploadOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SmlApi
      ResourceId: !Ref UploadResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: !Sub "'${AllowedCorsOrigin}'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # ============================================================
  # 4. Permission para que API Gateway pueda invocar la Lambda
  # ============================================================
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GeneratePresignedUrlLambdaArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SmlApi}/*/POST/upload'

  # ============================================================
  # 5. Deployment + Stage
  # ============================================================
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - UploadPostMethod
      - UploadOptionsMethod
    Properties:
      RestApiId: !Ref SmlApi
      Description: Deployment con Lambda integration

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref SmlApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod
      Description: Production stage

# ============================================================
# Outputs
# ============================================================
Outputs:
  ApiId:
    Description: ID de la API Gateway
    Value: !Ref SmlApi
    Export:
      Name: SmlApiId

  ApiUrl:
    Description: URL base de la API
    Value: !Sub 'https://${SmlApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: SmlApiUrl

  UploadEndpoint:
    Description: Endpoint para solicitar presigned URL de upload
    Value: !Sub 'https://${SmlApi}.execute-api.${AWS::Region}.amazonaws.com/prod/upload'
