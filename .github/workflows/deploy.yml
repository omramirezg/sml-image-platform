name: Deploy — SmartMedia Labs

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

# Evita deploys paralelos: espera a que el actual termine antes de iniciar el siguiente.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION:      us-east-1
  LAMBDA_ROLE_ARN: arn:aws:iam::372123585270:role/sml-lambda-execution-role
  LAMBDA_RUNTIME:  nodejs18.x
  S3_INPUT:        sml-images-input
  S3_FRONTEND:     sml-frontend
  CFN_STACK:       sml-api
  CFN_TEMPLATE:    backend/infra/api-gateway.yaml

jobs:

  # ═══════════════════════════════════════════════════════════
  # JOB 1 — Lambda Functions
  # Debe ejecutarse ANTES que deploy-infra para que las funciones
  # existan cuando CloudFormation asigne los permisos de invocación.
  # ═══════════════════════════════════════════════════════════
  deploy-lambdas:
    name: "Lambda · ${{ matrix.lambda.name }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        lambda:
          # name    → nombre de la función en AWS
          # path    → directorio en el repositorio
          # timeout → segundos máximos de ejecución
          # memory  → MB (el CPU escala proporcionalmente)
          - name: sml-generate-presigned-url
            path: backend/lambdas/generatePresignedUrl
            handler: index.handler
            timeout: 15
            memory: 256
          - name: sml-process-image
            path: backend/lambdas/processImage
            handler: index.handler
            timeout: 60
            memory: 512

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar existencia del directorio
        id: check-dir
        run: |
          if [ -d "${{ matrix.lambda.path }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Directorio ${{ matrix.lambda.path }} no encontrado. Deploy de ${{ matrix.lambda.name }} omitido."
          fi

      - name: Configurar Node.js 18
        if: steps.check-dir.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.lambda.path }}/package-lock.json

      - name: Configurar credenciales AWS
        if: steps.check-dir.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Instalar dependencias (prod)
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ matrix.lambda.path }}
        run: npm ci --omit=dev

      - name: Empaquetar ZIP
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ matrix.lambda.path }}
        run: |
          zip -r function.zip . \
            --exclude "*.test.js" \
            --exclude "*.spec.js" \
            --exclude ".env*" \
            --exclude "coverage/*"
          echo "Tamaño del ZIP: $(du -sh function.zip | cut -f1)"

      - name: Crear o actualizar Lambda
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ matrix.lambda.path }}
        run: |
          FUNCTION_NAME="${{ matrix.lambda.name }}"
          HANDLER="${{ matrix.lambda.handler }}"

          if aws lambda get-function \
               --function-name "$FUNCTION_NAME" \
               --region        "${{ env.AWS_REGION }}" \
               --query         "Configuration.FunctionName" \
               --output        text 2>/dev/null; then

            echo ">>> Actualizando código de $FUNCTION_NAME..."
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file      fileb://function.zip \
              --region        "${{ env.AWS_REGION }}"

            aws lambda wait function-updated \
              --function-name "$FUNCTION_NAME" \
              --region        "${{ env.AWS_REGION }}"

          else

            echo ">>> Creando función $FUNCTION_NAME..."
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime       "${{ env.LAMBDA_RUNTIME }}" \
              --role          "${{ env.LAMBDA_ROLE_ARN }}" \
              --handler       "$HANDLER" \
              --zip-file      fileb://function.zip \
              --timeout       ${{ matrix.lambda.timeout }} \
              --memory-size   ${{ matrix.lambda.memory }} \
              --region        "${{ env.AWS_REGION }}"

            aws lambda wait function-active \
              --function-name "$FUNCTION_NAME" \
              --region        "${{ env.AWS_REGION }}"

          fi
          echo "Lambda $FUNCTION_NAME desplegada."

      - name: Aplicar timeout y memoria
        if: steps.check-dir.outputs.exists == 'true'
        run: |
          aws lambda update-function-configuration \
            --function-name "${{ matrix.lambda.name }}" \
            --timeout       ${{ matrix.lambda.timeout }} \
            --memory-size   ${{ matrix.lambda.memory }} \
            --region        "${{ env.AWS_REGION }}"
          aws lambda wait function-updated \
            --function-name "${{ matrix.lambda.name }}" \
            --region        "${{ env.AWS_REGION }}"
          echo "Config: timeout=${{ matrix.lambda.timeout }}s, memory=${{ matrix.lambda.memory }}MB"

  # ═══════════════════════════════════════════════════════════
  # JOB 2 — CloudFormation: API Gateway
  # Necesita las Lambdas activas para poder otorgarles permisos
  # de invocación desde API Gateway.
  # ═══════════════════════════════════════════════════════════
  deploy-infra:
    name: "Infra · CloudFormation (API Gateway)"
    runs-on: ubuntu-latest
    needs: deploy-lambdas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Desplegar stack CloudFormation
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.CFN_TEMPLATE }} \
            --stack-name    ${{ env.CFN_STACK }} \
            --region        ${{ env.AWS_REGION }} \
            --no-fail-on-empty-changeset
          echo "Stack ${{ env.CFN_STACK }} desplegado."

      # CloudFormation no redesploya el stage automáticamente al cambiar integraciones.
      # Este paso fuerza un nuevo deployment apuntando al stage prod.
      - name: Forzar redespliegue del stage prod
        run: |
          API_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.CFN_STACK }}" \
            --query      "Stacks[0].Outputs[?OutputKey=='ApiId'].OutputValue" \
            --output     text \
            --region     "${{ env.AWS_REGION }}")

          aws apigateway create-deployment \
            --rest-api-id "$API_ID" \
            --stage-name  prod \
            --description "ci-${{ github.sha }}" \
            --region      "${{ env.AWS_REGION }}"

          echo "Stage prod actualizado (commit ${{ github.sha }})."

      # Otorga permiso a API Gateway para invocar cada Lambda.
      # El operador || evita fallo si el permiso ya existe (idempotente).
      - name: Otorgar permisos API Gateway → Lambdas
        run: |
          API_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.CFN_STACK }}" \
            --query      "Stacks[0].Outputs[?OutputKey=='ApiId'].OutputValue" \
            --output     text \
            --region     "${{ env.AWS_REGION }}")

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          grant_permission() {
            local FUNCTION=$1
            local STATEMENT=$2
            local SOURCE_ARN=$3

            if aws lambda get-function --function-name "$FUNCTION" \
                 --region "${{ env.AWS_REGION }}" > /dev/null 2>&1; then
              aws lambda add-permission \
                --function-name "$FUNCTION" \
                --statement-id  "$STATEMENT" \
                --action        lambda:InvokeFunction \
                --principal     apigateway.amazonaws.com \
                --source-arn    "$SOURCE_ARN" \
                --region        "${{ env.AWS_REGION }}" 2>/dev/null \
              && echo "Permiso $STATEMENT agregado." \
              || echo "Permiso $STATEMENT ya existía."
            else
              echo "::warning::Función $FUNCTION no encontrada, permiso $STATEMENT omitido."
            fi
          }

          BASE_ARN="arn:aws:execute-api:${{ env.AWS_REGION }}:${ACCOUNT_ID}:${API_ID}"

          grant_permission "sml-generate-presigned-url" "apigw-upload" "${BASE_ARN}/*/POST/upload"

      - name: Configurar CORS en sml-images-output
        run: |
          aws s3api put-bucket-cors \
            --bucket sml-images-output \
            --cors-configuration '{
              "CORSRules": [{
                "AllowedHeaders": ["*"],
                "AllowedMethods": ["GET", "HEAD"],
                "AllowedOrigins": ["*"],
                "ExposeHeaders": ["Content-Length", "Content-Type"],
                "MaxAgeSeconds": 3000
              }]
            }' \
            --region "${{ env.AWS_REGION }}"
          echo "CORS configurado en sml-images-output."

      - name: Mostrar outputs del stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${{ env.CFN_STACK }}" \
            --query      "Stacks[0].Outputs" \
            --output     table \
            --region     "${{ env.AWS_REGION }}"

  # ═══════════════════════════════════════════════════════════
  # JOB 3 — Trigger S3 → sml-process-image
  # Corre en paralelo con deploy-infra (ambos dependen de deploy-lambdas).
  # ═══════════════════════════════════════════════════════════
  configure-s3-trigger:
    name: "Trigger · S3 → sml-process-image"
    runs-on: ubuntu-latest
    needs: deploy-lambdas

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Verificar que sml-process-image existe
        id: check-lambda
        run: |
          if aws lambda get-function \
               --function-name sml-process-image \
               --region        "${{ env.AWS_REGION }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::sml-process-image no encontrada. Trigger S3 omitido."
          fi

      - name: Obtener ARN de sml-process-image
        if: steps.check-lambda.outputs.exists == 'true'
        id: get-arn
        run: |
          LAMBDA_ARN=$(aws lambda get-function \
            --function-name sml-process-image \
            --query         "Configuration.FunctionArn" \
            --output        text \
            --region        "${{ env.AWS_REGION }}")
          echo "lambda_arn=$LAMBDA_ARN" >> $GITHUB_OUTPUT
          echo "ARN: $LAMBDA_ARN"

      - name: Agregar permiso de invocación desde S3
        if: steps.check-lambda.outputs.exists == 'true'
        run: |
          aws lambda add-permission \
            --function-name sml-process-image \
            --statement-id  s3-invoke-permission \
            --action        lambda:InvokeFunction \
            --principal     s3.amazonaws.com \
            --source-arn    "arn:aws:s3:::${{ env.S3_INPUT }}" \
            --region        "${{ env.AWS_REGION }}" 2>/dev/null \
          && echo "Permiso S3 agregado." \
          || echo "Permiso S3 ya existía, continuando."

      - name: Configurar notificación S3 → Lambda
        if: steps.check-lambda.outputs.exists == 'true'
        run: |
          LAMBDA_ARN="${{ steps.get-arn.outputs.lambda_arn }}"
          aws s3api put-bucket-notification-configuration \
            --bucket "${{ env.S3_INPUT }}" \
            --notification-configuration "{
              \"LambdaFunctionConfigurations\": [
                {
                  \"Id\": \"trigger-jpg\",
                  \"LambdaFunctionArn\": \"$LAMBDA_ARN\",
                  \"Events\": [\"s3:ObjectCreated:*\"],
                  \"Filter\": {\"Key\": {\"FilterRules\": [{\"Name\": \"prefix\", \"Value\": \"uploads/\"}, {\"Name\": \"suffix\", \"Value\": \".jpg\"}]}}
                },
                {
                  \"Id\": \"trigger-jpeg\",
                  \"LambdaFunctionArn\": \"$LAMBDA_ARN\",
                  \"Events\": [\"s3:ObjectCreated:*\"],
                  \"Filter\": {\"Key\": {\"FilterRules\": [{\"Name\": \"prefix\", \"Value\": \"uploads/\"}, {\"Name\": \"suffix\", \"Value\": \".jpeg\"}]}}
                },
                {
                  \"Id\": \"trigger-png\",
                  \"LambdaFunctionArn\": \"$LAMBDA_ARN\",
                  \"Events\": [\"s3:ObjectCreated:*\"],
                  \"Filter\": {\"Key\": {\"FilterRules\": [{\"Name\": \"prefix\", \"Value\": \"uploads/\"}, {\"Name\": \"suffix\", \"Value\": \".png\"}]}}
                },
                {
                  \"Id\": \"trigger-webp\",
                  \"LambdaFunctionArn\": \"$LAMBDA_ARN\",
                  \"Events\": [\"s3:ObjectCreated:*\"],
                  \"Filter\": {\"Key\": {\"FilterRules\": [{\"Name\": \"prefix\", \"Value\": \"uploads/\"}, {\"Name\": \"suffix\", \"Value\": \".webp\"}]}}
                }
              ]
            }"
          echo "Trigger S3 → sml-process-image configurado."

  # ═══════════════════════════════════════════════════════════
  # JOB 4 — Frontend (vanilla HTML/CSS/JS, sin paso de build)
  # Depende de deploy-infra para leer la URL de la API del stack.
  # ═══════════════════════════════════════════════════════════
  deploy-frontend:
    name: "Frontend · Sync → S3"
    runs-on: ubuntu-latest
    needs: deploy-infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Obtener API URL desde CloudFormation
        id: get-api-url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.CFN_STACK }}" \
            --query      "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output     text \
            --region     "${{ env.AWS_REGION }}")
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "API URL: $API_URL"

      # Reemplaza la URL hardcodeada en config.js con la del stack activo.
      - name: Inyectar API URL en config.js
        run: |
          sed -i "s|API_URL:.*|API_URL: \"${{ steps.get-api-url.outputs.api_url }}\",|" frontend/config.js
          grep "API_URL" frontend/config.js

      - name: Sync frontend → S3
        run: |
          aws s3 sync frontend/ s3://${{ env.S3_FRONTEND }}/ \
            --delete \
            --region "${{ env.AWS_REGION }}"
          echo "Frontend sincronizado en s3://${{ env.S3_FRONTEND }}/"

      - name: Mostrar URL del sitio
        run: |
          # CloudFront es global, no requiere --region
          CF_DOMAIN=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Origins.Items[0].DomainName,'${{ env.S3_FRONTEND }}')].DomainName" \
            --output text 2>/dev/null | head -1)

          if [ -n "$CF_DOMAIN" ] && [ "$CF_DOMAIN" != "None" ]; then
            SITE_URL="https://$CF_DOMAIN"
          else
            SITE_URL="http://${{ env.S3_FRONTEND }}.s3-website-${{ env.AWS_REGION }}.amazonaws.com"
          fi

          echo "========================================"
          echo "  SITIO: $SITE_URL"
          echo "  API:   ${{ steps.get-api-url.outputs.api_url }}"
          echo "========================================"

          {
            echo "## Deploy completado"
            echo "| | URL |"
            echo "|---|---|"
            echo "| Frontend | $SITE_URL |"
            echo "| API Gateway | ${{ steps.get-api-url.outputs.api_url }} |"
          } >> "$GITHUB_STEP_SUMMARY"

