name: Destroy — SmartMedia Labs

# ─────────────────────────────────────────────────────────────
# ADVERTENCIA: Este workflow elimina TODOS los recursos AWS
# del proyecto de forma permanente e irreversible.
#
# Solo se ejecuta manualmente (workflow_dispatch).
# Requiere escribir DESTROY como confirmación.
# ─────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escribe DESTROY para confirmar la eliminación total de infraestructura"
        required: true
        type: string

env:
  AWS_REGION:      us-east-1
  CFN_STACK:       sml-api
  LAMBDA_ROLE:     sml-lambda-execution-role
  SNS_TOPIC_ARN:   arn:aws:sns:us-east-1:372123585270:sml-image-notifications
  DYNAMODB_TABLE:  sml-image-metadata

jobs:

  # ═══════════════════════════════════════════════════════════
  # GUARD: bloquea la ejecución si la confirmación no es exacta
  # ═══════════════════════════════════════════════════════════
  guard:
    name: "Verificar confirmación"
    runs-on: ubuntu-latest

    steps:
      - name: Validar input de confirmación
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DESTROY" ]; then
            echo "::error::Confirmación inválida. Escribe exactamente DESTROY para proceder."
            exit 1
          fi
          echo "Confirmación aceptada. Iniciando destrucción de infraestructura..."

  # ═══════════════════════════════════════════════════════════
  # DESTROY: eliminación ordenada de recursos
  # Orden: aplicación → datos → red → IAM
  # ═══════════════════════════════════════════════════════════
  destroy:
    name: "Destroy Infrastructure"
    runs-on: ubuntu-latest
    needs: guard

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 1. Eliminar stack CloudFormation (API Gateway) ─────
      - name: "1/7 · Eliminar stack CloudFormation"
        run: |
          if aws cloudformation describe-stacks \
               --stack-name "${{ env.CFN_STACK }}" \
               --region "${{ env.AWS_REGION }}" 2>/dev/null; then
            echo "Eliminando stack ${{ env.CFN_STACK }}..."
            aws cloudformation delete-stack \
              --stack-name "${{ env.CFN_STACK }}" \
              --region "${{ env.AWS_REGION }}"
            aws cloudformation wait stack-delete-complete \
              --stack-name "${{ env.CFN_STACK }}" \
              --region "${{ env.AWS_REGION }}"
            echo "Stack eliminado."
          else
            echo "Stack ${{ env.CFN_STACK }} no encontrado, omitiendo."
          fi

      # ── 2. Eliminar funciones Lambda ───────────────────────
      - name: "2/7 · Eliminar funciones Lambda"
        run: |
          for fn in sml-generate-presigned-url sml-process-image sml-get-history; do
            if aws lambda get-function \
                 --function-name "$fn" \
                 --region "${{ env.AWS_REGION }}" 2>/dev/null; then
              echo "Eliminando Lambda: $fn"
              aws lambda delete-function \
                --function-name "$fn" \
                --region "${{ env.AWS_REGION }}"
              echo "Lambda $fn eliminada."
            else
              echo "Lambda $fn no encontrada, omitiendo."
            fi
          done

      # ── 3. Vaciar y eliminar buckets S3 ────────────────────
      # Orden: input → output → frontend
      # El bucket input puede tener versiones si el versionado
      # fue activado; se borran objetos y delete markers.
      - name: "3/7 · Vaciar y eliminar buckets S3"
        run: |
          for bucket in sml-images-input sml-images-output sml-frontend; do
            if aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
              echo "Vaciando bucket: $bucket"

              # Borrar todos los objetos
              aws s3 rm "s3://$bucket" --recursive

              # Borrar versiones y delete markers (si versionado estuviera activo)
              VERSIONS=$(aws s3api list-object-versions \
                --bucket "$bucket" \
                --query "Versions[].{Key:Key,VersionId:VersionId}" \
                --output json 2>/dev/null)
              MARKERS=$(aws s3api list-object-versions \
                --bucket "$bucket" \
                --query "DeleteMarkers[].{Key:Key,VersionId:VersionId}" \
                --output json 2>/dev/null)

              for item in $(echo "$VERSIONS $MARKERS" | jq -c '.[]? // empty'); do
                KEY=$(echo "$item" | jq -r '.Key')
                VID=$(echo "$item" | jq -r '.VersionId')
                aws s3api delete-object \
                  --bucket "$bucket" \
                  --key "$KEY" \
                  --version-id "$VID" 2>/dev/null || true
              done

              echo "Eliminando bucket: $bucket"
              aws s3api delete-bucket \
                --bucket "$bucket" \
                --region "${{ env.AWS_REGION }}"
              echo "Bucket $bucket eliminado."
            else
              echo "Bucket $bucket no encontrado, omitiendo."
            fi
          done

      # ── 4. Eliminar tabla DynamoDB ─────────────────────────
      # Requiere deshabilitar deletion protection antes de borrar.
      - name: "4/7 · Eliminar tabla DynamoDB"
        run: |
          TABLE_STATUS=$(aws dynamodb describe-table \
            --table-name "${{ env.DYNAMODB_TABLE }}" \
            --query "Table.TableStatus" \
            --output text \
            --region "${{ env.AWS_REGION }}" 2>/dev/null)

          if [ -n "$TABLE_STATUS" ]; then
            echo "Deshabilitando deletion protection..."
            aws dynamodb update-table \
              --table-name "${{ env.DYNAMODB_TABLE }}" \
              --no-deletion-protection-enabled \
              --region "${{ env.AWS_REGION }}" 2>/dev/null || true

            echo "Eliminando tabla ${{ env.DYNAMODB_TABLE }}..."
            aws dynamodb delete-table \
              --table-name "${{ env.DYNAMODB_TABLE }}" \
              --region "${{ env.AWS_REGION }}"

            aws dynamodb wait table-not-exists \
              --table-name "${{ env.DYNAMODB_TABLE }}" \
              --region "${{ env.AWS_REGION }}"
            echo "Tabla eliminada."
          else
            echo "Tabla ${{ env.DYNAMODB_TABLE }} no encontrada, omitiendo."
          fi

      # ── 5. Eliminar topic SNS y sus suscripciones ──────────
      - name: "5/7 · Eliminar topic SNS"
        run: |
          TOPIC_EXISTS=$(aws sns get-topic-attributes \
            --topic-arn "${{ env.SNS_TOPIC_ARN }}" \
            --query "Attributes.TopicArn" \
            --output text \
            --region "${{ env.AWS_REGION }}" 2>/dev/null)

          if [ -n "$TOPIC_EXISTS" ]; then
            echo "Eliminando suscripciones del topic..."
            SUBS=$(aws sns list-subscriptions-by-topic \
              --topic-arn "${{ env.SNS_TOPIC_ARN }}" \
              --query "Subscriptions[?SubscriptionArn!='PendingConfirmation'].SubscriptionArn" \
              --output text \
              --region "${{ env.AWS_REGION }}" 2>/dev/null)

            for sub in $SUBS; do
              aws sns unsubscribe \
                --subscription-arn "$sub" \
                --region "${{ env.AWS_REGION }}" 2>/dev/null || true
              echo "Suscripción $sub eliminada."
            done

            echo "Eliminando topic SNS..."
            aws sns delete-topic \
              --topic-arn "${{ env.SNS_TOPIC_ARN }}" \
              --region "${{ env.AWS_REGION }}"
            echo "Topic SNS eliminado."
          else
            echo "Topic SNS no encontrado, omitiendo."
          fi

      # ── 6. Desasociar políticas y eliminar IAM Role ────────
      - name: "6/7 · Eliminar IAM Role de Lambdas"
        run: |
          ROLE_EXISTS=$(aws iam get-role \
            --role-name "${{ env.LAMBDA_ROLE }}" \
            --query "Role.RoleName" \
            --output text 2>/dev/null)

          if [ -n "$ROLE_EXISTS" ]; then
            echo "Desasociando managed policies..."
            for policy in \
              AWSLambdaBasicExecutionRole \
              AmazonS3FullAccess \
              AmazonDynamoDBFullAccess \
              AmazonSNSFullAccess; do
              aws iam detach-role-policy \
                --role-name "${{ env.LAMBDA_ROLE }}" \
                --policy-arn "arn:aws:iam::aws:policy/$policy" \
              2>/dev/null && echo "Policy $policy desasociada." || true
            done

            echo "Eliminando IAM Role ${{ env.LAMBDA_ROLE }}..."
            aws iam delete-role --role-name "${{ env.LAMBDA_ROLE }}"
            echo "IAM Role eliminado."
          else
            echo "IAM Role ${{ env.LAMBDA_ROLE }} no encontrado, omitiendo."
          fi

      # ── 7. Resumen final ───────────────────────────────────
      - name: "7/7 · Resumen de destrucción"
        run: |
          echo "================================================"
          echo "Destrucción de infraestructura completada."
          echo "Recursos procesados:"
          echo "  - CloudFormation stack : ${{ env.CFN_STACK }}"
          echo "  - Lambdas              : sml-generate-presigned-url, sml-process-image, sml-get-history"
          echo "  - S3 buckets           : sml-images-input, sml-images-output, sml-frontend"
          echo "  - DynamoDB             : ${{ env.DYNAMODB_TABLE }}"
          echo "  - SNS Topic            : ${{ env.SNS_TOPIC_ARN }}"
          echo "  - IAM Role             : ${{ env.LAMBDA_ROLE }}"
          echo "================================================"
          echo "Los IAM Users (sml-*) NO fueron eliminados."
          echo "Eliminarlos manualmente si es necesario."
